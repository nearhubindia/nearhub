<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Scrapper</title>
    <style>
      :root {
        --bg-top: #0a111f;
        --bg-bottom: #111a2e;
        --panel: rgba(255, 255, 255, 0.08);
        --panel-border: rgba(255, 255, 255, 0.14);
        --text: #eef4ff;
        --muted: #aab8d8;
        --success: #34d399;
        --danger: #f87171;
        --accent: #67e8f9;
        --accent-2: #fbbf24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 360px;
        color: var(--text);
        font-family: "Trebuchet MS", "Gill Sans", "Lucida Sans", sans-serif;
        background:
          radial-gradient(circle at 8% 12%, rgba(103, 232, 249, 0.18), transparent 45%),
          radial-gradient(circle at 90% 18%, rgba(251, 191, 36, 0.12), transparent 42%),
          linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      }

      .wrap {
        padding: 14px;
        animation: fadeIn 300ms ease-out;
      }

      .hero {
        border: 1px solid var(--panel-border);
        background: linear-gradient(120deg, rgba(12, 21, 39, 0.85), rgba(20, 33, 56, 0.75));
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 12px 24px rgba(5, 10, 20, 0.35);
      }

      .title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .subtitle {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .stat {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(103, 232, 249, 0.1);
        border: 1px solid rgba(103, 232, 249, 0.25);
        font-size: 12px;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px rgba(103, 232, 249, 0.8);
      }

      .panel {
        margin-top: 12px;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        border-radius: 12px;
        padding: 12px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-size: 12px;
        color: var(--muted);
      }

      input[type="number"] {
        width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(7, 14, 26, 0.78);
        color: var(--text);
        padding: 10px;
        outline: none;
      }

      input[type="number"]:focus {
        border-color: rgba(103, 232, 249, 0.7);
        box-shadow: 0 0 0 2px rgba(103, 232, 249, 0.2);
      }

      input[type="text"] {
        width: 100%;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(7, 14, 26, 0.78);
        color: var(--text);
        padding: 10px;
        outline: none;
        margin-top: 8px;
      }

      input[type="text"]:focus {
        border-color: rgba(103, 232, 249, 0.7);
        box-shadow: 0 0 0 2px rgba(103, 232, 249, 0.2);
      }

      .actions {
        margin-top: 12px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
        transition: transform 120ms ease, filter 140ms ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        filter: brightness(1.05);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      #scrapeBtn {
        background: linear-gradient(120deg, #22c55e, #86efac);
        color: #052e16;
      }

      #exportBtn {
        background: linear-gradient(120deg, #38bdf8, #67e8f9);
        color: #083344;
      }

      #exportExcelBtn {
        background: linear-gradient(120deg, #fbbf24, #fde68a);
        color: #78350f;
      }

      #clearBtn {
        margin-top: 8px;
        width: 100%;
        background: linear-gradient(120deg, #fb7185, #f97316);
        color: #fff1f2;
      }

      .status {
        margin-top: 12px;
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 12px;
        line-height: 1.35;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(15, 24, 41, 0.75);
        color: var(--muted);
        min-height: 38px;
      }

      .status.success {
        border-color: rgba(52, 211, 153, 0.45);
        color: #bbf7d0;
        background: rgba(6, 40, 28, 0.45);
      }

      .status.error {
        border-color: rgba(248, 113, 113, 0.45);
        color: #fecaca;
        background: rgba(69, 10, 10, 0.45);
      }

      .status.loading {
        border-color: rgba(103, 232, 249, 0.4);
        color: #cffafe;
        background: rgba(14, 37, 56, 0.45);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section class="hero">
        <h1 class="title">Data Scrapper</h1>
        <p class="subtitle">Extract business details from loaded Maps results and export as JSON or Excel.</p>
        <div class="stat"><span class="dot"></span><span id="count">Saved records: 0</span></div>
      </section>

      <section class="panel">
        <label for="maxCount">Max businesses to scrape</label>
        <input id="maxCount" type="number" min="1" max="500" value="50" />
        <label for="excelPath">Excel path (Downloads-relative)</label>
        <input id="excelPath" type="text" placeholder="Example: MapsExports/texas-list.xls" />

        <div class="actions">
          <button id="scrapeBtn">Scrape Data</button>
          <button id="exportBtn">Export JSON</button>
          <button id="exportExcelBtn">Export Excel</button>
        </div>
        <button id="clearBtn">Clear Saved Data</button>

        <div id="status" class="status">Open a Google Maps search results page and click Scrape Data.</div>
      </section>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
