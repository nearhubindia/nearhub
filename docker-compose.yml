services:
  redis:
    image: redis:7-alpine
    container_name: nearhub-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nearhub-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      HOST: 0.0.0.0
      SERVER_PORT: 5000
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:Synvide%40123@localhost:5432/nearhub}
      REDIS_ENABLED: "true"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6380
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
      ELASTICSEARCH_ENABLED: "false"
    volumes:
      - ./server:/app/server
      - server_node_modules:/app/server/node_modules
    command: npm run dev

volumes:
  server_node_modules:
