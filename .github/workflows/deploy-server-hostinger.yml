name: Deploy Server (Hostinger VPS, Artifact Only)

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-server-hostinger.yml"
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "Run `npm run db:migrate` on VPS after deploy"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: deploy-server-main
  cancel-in-progress: false

jobs:
  build-artifact:
    name: Build server artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Package artifact
        run: |
          mkdir -p ../release
          cp package.json package-lock.json ../release/
          cp -R dist ../release/
          cp -R migrations ../release/
          tar -C ../release -czf ../server-release.tgz .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-release
          path: server-release.tgz
          retention-days: 7

  deploy:
    name: Deploy artifact to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-artifact
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: server-release
          path: .

      - name: Copy artifact to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_VPS_PORT || '22' }}
          source: "server-release.tgz"
          target: "/tmp"

      - name: Deploy release on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_MIGRATIONS: ${{ github.event.inputs.run_migrations || 'false' }}
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_VPS_PORT || '22' }}
          envs: RUN_MIGRATIONS
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.HOSTINGER_APP_DIR }}"
            SERVICE_NAME="${{ secrets.HOSTINGER_SERVICE_NAME }}"

            mkdir -p "$APP_DIR/releases"
            RELEASE_DIR="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$RELEASE_DIR"

            tar -xzf /tmp/server-release.tgz -C "$RELEASE_DIR"
            rm -f /tmp/server-release.tgz

            cd "$RELEASE_DIR"
            npm ci --omit=dev

            if [ "${RUN_MIGRATIONS}" = "true" ]; then
              npm run db:migrate || true
            fi

            ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

            if [ -n "$SERVICE_NAME" ]; then
              sudo systemctl restart "$SERVICE_NAME"
              sudo systemctl status "$SERVICE_NAME" --no-pager -l | head -n 40 || true
            fi
