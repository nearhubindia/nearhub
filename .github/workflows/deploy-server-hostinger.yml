name: Deploy Server (Hostinger VPS, Artifact Only)

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/deploy-server-hostinger.yml"
  workflow_dispatch:

concurrency:
  group: deploy-server-main
  cancel-in-progress: false

jobs:
  build-artifact:
    name: Build server artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Package artifact
        run: |
          mkdir -p ../release
          cp package.json package-lock.json ../release/
          cp -R dist ../release/
          cp -R migrations ../release/
          cp -R scripts ../release/
          cp drizzle.config.js ../release/
          if [ -d data ]; then cp -R data ../release/; fi
          {
            echo "mode=artifact_only"
            echo "commit_sha=${GITHUB_SHA}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../release/DEPLOYMENT_MANIFEST
          tar -C ../release -czf ../server-release.tgz .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: server-release
          path: server-release.tgz
          retention-days: 7

  deploy:
    name: Deploy artifact to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build-artifact
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: server-release
          path: .

      - name: Copy artifact to VPS
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.HOSTINGER_VPS_PORT || '22' }}"
          HOST="${{ secrets.HOSTINGER_VPS_HOST }}"
          USER="${{ secrets.HOSTINGER_VPS_USER }}"

          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_hostinger
          printf '%s\n' "${{ secrets.HOSTINGER_VPS_SSH_KEY }}" > ~/.ssh/id_hostinger

          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          scp \
            -i ~/.ssh/id_hostinger \
            -P "$PORT" \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            ./server-release.tgz \
            "$USER@$HOST:/tmp/server-release.tgz"

      - name: Deploy release on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_VPS_HOST }}
          username: ${{ secrets.HOSTINGER_VPS_USER }}
          key: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_VPS_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.HOSTINGER_APP_DIR }}"
            SERVICE_NAME="${{ secrets.HOSTINGER_SERVICE_NAME }}"
            PM2_APP_NAME="${{ secrets.HOSTINGER_PM2_APP_NAME || 'nearhub-server' }}"

            mkdir -p "$APP_DIR/releases" "$APP_DIR/shared"
            RELEASE_DIR="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$RELEASE_DIR"

            tar -xzf /tmp/server-release.tgz -C "$RELEASE_DIR"
            rm -f /tmp/server-release.tgz

            # Artifact-only guard: deployment bundle must not contain a git checkout.
            if [ -d "$RELEASE_DIR/.git" ] || [ -f "$RELEASE_DIR/.git" ]; then
              echo "[ERROR] Artifact contains .git metadata. Refusing deploy."
              exit 1
            fi

            if [ ! -f "$RELEASE_DIR/DEPLOYMENT_MANIFEST" ]; then
              echo "[ERROR] DEPLOYMENT_MANIFEST missing. Refusing deploy."
              exit 1
            fi

            echo "[INFO] Deploy manifest:"
            cat "$RELEASE_DIR/DEPLOYMENT_MANIFEST"

            if [ -f "$APP_DIR/shared/.env" ]; then
              mkdir -p "$RELEASE_DIR/server"
              ln -sfn "$APP_DIR/shared/.env" "$RELEASE_DIR/.env"
              ln -sfn "$APP_DIR/shared/.env" "$RELEASE_DIR/server/.env"
            else
              echo "[WARN] Missing $APP_DIR/shared/.env. Runtime may fail without DATABASE_URL."
            fi

            cd "$RELEASE_DIR"
            # Always run DB migrations before switching current release.
            # We install dev deps temporarily because drizzle-kit is a dev dependency.
            npm ci
            npm run db:migrate
            npm prune --omit=dev

            ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

            # Restart runtime process.
            if [ -n "$SERVICE_NAME" ]; then
              UNIT_NAME="$SERVICE_NAME"
              case "$UNIT_NAME" in
                *.service) ;;
                *) UNIT_NAME="${UNIT_NAME}.service" ;;
              esac

              if sudo systemctl cat "$UNIT_NAME" >/dev/null 2>&1; then
                sudo systemctl restart "$UNIT_NAME"
                sudo systemctl status "$UNIT_NAME" --no-pager -l | head -n 40 || true
              else
                echo "[WARN] Systemd unit '$UNIT_NAME' not found. Skipping restart."
                echo "[WARN] Set HOSTINGER_SERVICE_NAME to an existing service unit name."
                SERVICE_NAME=""
              fi
            else
              echo "[WARN] HOSTINGER_SERVICE_NAME is empty. Skipping service restart."
            fi

            # PM2 fallback for hosts not using systemd service.
            if [ -z "$SERVICE_NAME" ] && command -v pm2 >/dev/null 2>&1; then
              if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
                pm2 restart "$PM2_APP_NAME" --update-env
              else
                pm2 start "$APP_DIR/current/dist/index.js" --name "$PM2_APP_NAME" --cwd "$APP_DIR/current" --time
              fi
              pm2 save
            fi
