name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gates:
    name: Architecture & Framework Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Architecture gate
        run: node scripts/gates/architecture-gate.mjs

      - name: Framework gate
        run: node scripts/gates/framework-gate.mjs

  app:
    name: App checks
    runs-on: ubuntu-latest
    needs: gates
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

  server:
    name: Server checks
    runs-on: ubuntu-latest
    needs: gates
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

  web:
    name: Web checks
    runs-on: ubuntu-latest
    needs: gates
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check
