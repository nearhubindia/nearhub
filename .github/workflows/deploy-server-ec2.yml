name: Deploy Server (AWS EC2, Docker Compose)

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'Dockerfile.prod'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-server-ec2.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server-main
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-artifact:
    name: Build server artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Package artifact
        run: |
          mkdir -p ../release
          cp package.json package-lock.json ../release/
          cp -R dist ../release/
          cp -R migrations ../release/
          cp -R scripts ../release/
          cp drizzle.config.js ../release/
          cp ../Dockerfile.prod ../release/
          cp ../docker-compose.prod.yml ../release/
          cp ../ops/systemd/nearhub-stack.service ../release/
          if [ -d data ]; then cp -R data ../release/; fi
          {
            echo "mode=artifact_docker"
            echo "commit_sha=${GITHUB_SHA}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../release/DEPLOYMENT_MANIFEST
          tar -C ../release -czf ../server-release.tgz .

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: server-release
          path: server-release.tgz
          retention-days: 7

  deploy:
    name: Deploy artifact to AWS EC2
    runs-on: ubuntu-latest
    needs: build-artifact
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: server-release
          path: .

      - name: Copy artifact to EC2
        shell: bash
        run: |
          set -euo pipefail
          PORT="${{ secrets.AWS_EC2_PORT || '22' }}"
          HOST="${{ secrets.AWS_EC2_HOST || '65.2.151.47' }}"
          USER="${{ secrets.AWS_EC2_USER || 'admin' }}"

          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_nearhub_ec2
          printf '%s\n' "${{ secrets.AWS_EC2_SSH_KEY }}" > ~/.ssh/id_nearhub_ec2

          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/id_nearhub_ec2 \
            -p "$PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            "$USER@$HOST" 'echo "[INFO] SSH preflight OK"'

          scp \
            -i ~/.ssh/id_nearhub_ec2 \
            -P "$PORT" \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o StrictHostKeyChecking=yes \
            ./server-release.tgz \
            "$USER@$HOST:/tmp/server-release.tgz"

      - name: Deploy release on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          port: ${{ secrets.AWS_EC2_PORT || '22' }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.AWS_APP_DIR || '/opt/nearhub-server' }}"
            ENV_FILE="${{ secrets.AWS_ENV_FILE || '/etc/nearhub/server.env' }}"
            COMPOSE_PROJECT_NAME="${{ secrets.AWS_COMPOSE_PROJECT_NAME || 'nearhub' }}"
            COMPOSE_FILE_NAME="${{ secrets.AWS_COMPOSE_FILE_NAME || 'docker-compose.prod.yml' }}"
            DOCKERFILE_NAME="${{ secrets.AWS_DOCKERFILE_NAME || 'Dockerfile.prod' }}"
            SYSTEMD_UNIT_NAME="${{ secrets.AWS_SYSTEMD_UNIT_NAME || 'nearhub-stack.service' }}"
            EXPECTED_COMMIT_SHA="${{ github.sha }}"

            mkdir -p "$APP_DIR/releases" "$APP_DIR/shared"
            PREVIOUS_RELEASE="$(readlink -f "$APP_DIR/current" 2>/dev/null || true)"
            RELEASE_DIR="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$RELEASE_DIR"

            rollback() {
              if [ -n "${PREVIOUS_RELEASE:-}" ] && [ -d "$PREVIOUS_RELEASE" ]; then
                echo "[WARN] Rolling back current release to $PREVIOUS_RELEASE"
                ln -sfn "$PREVIOUS_RELEASE" "$APP_DIR/current"
                sudo install -m 644 "$PREVIOUS_RELEASE/$SYSTEMD_UNIT_NAME" "/etc/systemd/system/$SYSTEMD_UNIT_NAME"
                sudo systemctl daemon-reload
                sudo systemctl enable --now "$SYSTEMD_UNIT_NAME"
              fi
            }

            trap 'rollback' ERR

            tar -xzf /tmp/server-release.tgz -C "$RELEASE_DIR"
            rm -f /tmp/server-release.tgz

            if [ -d "$RELEASE_DIR/.git" ] || [ -f "$RELEASE_DIR/.git" ]; then
              echo "[ERROR] Artifact contains .git metadata. Refusing deploy."
              exit 1
            fi

            if [ ! -f "$RELEASE_DIR/DEPLOYMENT_MANIFEST" ]; then
              echo "[ERROR] DEPLOYMENT_MANIFEST missing. Refusing deploy."
              exit 1
            fi

            echo "[INFO] Deploy manifest:"
            cat "$RELEASE_DIR/DEPLOYMENT_MANIFEST"

            RELEASE_COMMIT_SHA="$(grep '^commit_sha=' "$RELEASE_DIR/DEPLOYMENT_MANIFEST" | cut -d= -f2-)"
            if [ -z "$RELEASE_COMMIT_SHA" ]; then
              echo "[ERROR] commit_sha missing from DEPLOYMENT_MANIFEST."
              exit 1
            fi
            if [ "$RELEASE_COMMIT_SHA" != "$EXPECTED_COMMIT_SHA" ]; then
              echo "[ERROR] Release commit SHA ($RELEASE_COMMIT_SHA) does not match expected workflow SHA ($EXPECTED_COMMIT_SHA)."
              exit 1
            fi

            if [ -f "$ENV_FILE" ]; then
              ln -sfn "$ENV_FILE" "$RELEASE_DIR/.env"
            else
              echo "[WARN] Missing $ENV_FILE. Runtime may fail without DATABASE_URL."
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "[ERROR] Docker is not installed on the EC2 host."
              exit 1
            fi

            if ! command -v docker-compose >/dev/null 2>&1; then
              echo "[ERROR] Docker Compose is not available on the EC2 host."
              exit 1
            fi

            if [ ! -f "$RELEASE_DIR/$COMPOSE_FILE_NAME" ] || [ ! -f "$RELEASE_DIR/$DOCKERFILE_NAME" ]; then
              echo "[ERROR] Production Docker files are missing from the release artifact."
              exit 1
            fi
            if [ ! -f "$RELEASE_DIR/$SYSTEMD_UNIT_NAME" ]; then
              echo "[ERROR] Systemd unit is missing from the release artifact."
              exit 1
            fi

            sudo docker-compose -p "$COMPOSE_PROJECT_NAME" -f "$RELEASE_DIR/$COMPOSE_FILE_NAME" build server
            sudo docker-compose -p "$COMPOSE_PROJECT_NAME" -f "$RELEASE_DIR/$COMPOSE_FILE_NAME" up -d redis
            sudo docker-compose -p "$COMPOSE_PROJECT_NAME" -f "$RELEASE_DIR/$COMPOSE_FILE_NAME" run --rm --no-deps server npm run db:migrate
            sudo docker-compose -p "$COMPOSE_PROJECT_NAME" -f "$RELEASE_DIR/$COMPOSE_FILE_NAME" up -d server

            HEALTH_OK="false"
            for attempt in $(seq 1 18); do
              if curl -fsS http://127.0.0.1:5000/api/health >/tmp/nearhub-healthcheck.json 2>/dev/null; then
                HEALTH_OK="true"
                break
              fi
              echo "[INFO] Waiting for server healthcheck (attempt $attempt/18)..."
              sleep 5
            done
            if [ "$HEALTH_OK" != "true" ]; then
              echo "[ERROR] New release did not become healthy in time."
              exit 1
            fi

            ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

            sudo install -m 644 "$RELEASE_DIR/$SYSTEMD_UNIT_NAME" "/etc/systemd/system/$SYSTEMD_UNIT_NAME"
            sudo systemctl daemon-reload
            sudo systemctl enable --now "$SYSTEMD_UNIT_NAME"

            CURRENT_RELEASE="$(readlink -f "$APP_DIR/current")"
            if [ "$CURRENT_RELEASE" != "$RELEASE_DIR" ]; then
              echo "[ERROR] Current release symlink did not update correctly."
              exit 1
            fi

            CURRENT_COMMIT_SHA="$(grep '^commit_sha=' "$APP_DIR/current/DEPLOYMENT_MANIFEST" | cut -d= -f2-)"
            if [ "$CURRENT_COMMIT_SHA" != "$EXPECTED_COMMIT_SHA" ]; then
              echo "[ERROR] Current release manifest commit SHA ($CURRENT_COMMIT_SHA) does not match expected workflow SHA ($EXPECTED_COMMIT_SHA)."
              exit 1
            fi

            trap - ERR

            sudo docker-compose -p "$COMPOSE_PROJECT_NAME" -f "$RELEASE_DIR/$COMPOSE_FILE_NAME" ps
            cat /tmp/nearhub-healthcheck.json
