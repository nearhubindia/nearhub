<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="googlebot" content="noindex,nofollow" />
    <link rel="canonical" href="https://nearhub.in/404" />
    <title>Page Not Found | NearHub – Buy, Sell &amp; Discover Local Deals Near You</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        background: linear-gradient(180deg, #f7fbff 0%, #edf5ff 46%, #fff5ea 100%);
        color: #0f2d4d;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(620px, 100%);
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(30, 93, 168, 0.2);
        border-radius: 20px;
        box-shadow: 0 22px 40px -24px rgba(30, 93, 168, 0.55);
        padding: 28px;
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ff9933;
      }
      h1 {
        margin: 10px 0 8px;
        font-size: clamp(30px, 5vw, 46px);
        line-height: 1.15;
        color: #113965;
      }
      p {
        margin: 0;
        line-height: 1.6;
        color: #3f556b;
      }
      a {
        margin-top: 22px;
        display: inline-block;
        text-decoration: none;
        background: #1e5da8;
        color: #fff;
        font-weight: 600;
        border-radius: 10px;
        padding: 11px 16px;
      }
      a:hover {
        background: #2a71c6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="tag">Error 404</span>
      <h1>Page Not Found</h1>
      <p>
        This URL is not available right now. Return to NearHub to buy, sell, and discover local
        deals near you.
      </p>
      <a href="/">Back To Home</a>
    </main>
  </body>
</html>
