<!doctype html>
<html>
  <head>
    <title>Admin Auth Test</title>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #1a1a1a;
        color: #00ff00;
      }
      .status {
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #00ff00;
      }
      .error {
        border-color: #ff0000;
        color: #ff0000;
      }
      .success {
        border-color: #00ff00;
        color: #00ff00;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Admin Authentication Test</h1>

    <div id="status"></div>

    <button onclick="checkAuth()">Check Auth Status</button>
    <button onclick="loginAdmin()">Login as Admin</button>
    <button onclick="clearAuth()">Clear Auth</button>
    <button onclick="testSettingsUpdate()">Test Settings Update</button>

    <pre id="output"></pre>

    <script>
      const API_URL = 'http://localhost:5000';

      function log(msg) {
        document.getElementById('output').innerHTML += msg + '\n';
        console.log(msg);
      }

      function checkAuth() {
        document.getElementById('output').innerHTML = '';
        const token = localStorage.getItem('adminToken');
        const user = localStorage.getItem('adminUser');

        if (!token) {
          document.getElementById('status').className = 'status error';
          document.getElementById('status').innerHTML = '❌ NOT LOGGED IN - No token found';
          log('Token: NULL');
          log('User: NULL');
        } else {
          document.getElementById('status').className = 'status success';
          document.getElementById('status').innerHTML = '✅ LOGGED IN - Token exists';
          log('Token: ' + token.substring(0, 50) + '...');
          log('User: ' + user);

          // Decode JWT to check expiry
          try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const exp = new Date(payload.exp * 1000);
            const now = new Date();

            if (exp < now) {
              log('⚠️ TOKEN EXPIRED at: ' + exp.toISOString());
              document.getElementById('status').className = 'status error';
              document.getElementById('status').innerHTML = '❌ TOKEN EXPIRED - Please login again';
            } else {
              log('✅ Token valid until: ' + exp.toISOString());
              log('Token payload: ' + JSON.stringify(payload, null, 2));
            }
          } catch (e) {
            log('⚠️ Error parsing token: ' + e.message);
          }
        }
      }

      async function loginAdmin() {
        document.getElementById('output').innerHTML = '';
        log('Attempting login...');

        try {
          const response = await fetch(`${API_URL}/api/admin/login`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              email: 'admin@nearhub.local',
              password: 'admin123',
            }),
            credentials: 'include',
          });

          const data = await response.json();
          log('Response: ' + JSON.stringify(data, null, 2));

          if (data.success) {
            localStorage.setItem('adminToken', data.token);
            localStorage.setItem('adminUser', JSON.stringify(data.admin));
            log('✅ Login successful! Token saved.');
            checkAuth();
          } else {
            log('❌ Login failed: ' + data.message);
          }
        } catch (error) {
          log('❌ Error: ' + error.message);
        }
      }

      function clearAuth() {
        localStorage.removeItem('adminToken');
        localStorage.removeItem('adminUser');
        document.getElementById('output').innerHTML = '';
        log('✅ Auth cleared');
        checkAuth();
      }

      async function testSettingsUpdate() {
        document.getElementById('output').innerHTML = '';
        const token = localStorage.getItem('adminToken');

        if (!token) {
          log('❌ No token - login first!');
          return;
        }

        log('Testing settings update with token...');

        try {
          const response = await fetch(`${API_URL}/api/admin/settings/update`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              geoRadiusKm: 75,
            }),
            credentials: 'include',
          });

          log('Response status: ' + response.status);
          const data = await response.json();
          log('Response: ' + JSON.stringify(data, null, 2));

          if (response.ok) {
            log('✅ Settings update SUCCESS!');
          } else {
            log('❌ Settings update FAILED: ' + (data.error || data.message));
          }
        } catch (error) {
          log('❌ Error: ' + error.message);
        }
      }

      // Auto-check on load
      window.onload = checkAuth;
    </script>
  </body>
</html>
